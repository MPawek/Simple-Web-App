# Reference: https://github.com/marketplace/actions/build-and-push-docker-images
# Goal is to build docker image, then run test using apprentice action to verify output

# Implement health check?
# Map ports so there is no chance of mismatch
# Cleanup step
# I see mentions of GitHub secrets having problems with forked PRs, need to check if this is an issue 


# First step, build the Docker image
# Run this action on any push or pull request, conditional statements later will separate only pushes to main for publishing
name: CI (PR) and CD (Push to Main)
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Concurrency check so we don't overwrite code being pushed by multiple people at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set IMAGE_NAME variable as we'll use it a bunch
env:
  IMAGE_NAME: simple-web-app

jobs:
  CI:
    name: Build and Verify
    # ---------------
    # ALWAYS OCCURS
    # ---------------
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Check go version from file, echo GO_VERSION=<contents>, append to GITHUB_OUTPUT file
      - name: Read Go Version
        id: goversion
        run: echo "go_version=$(cat .go-version)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Locally built to run and test
        id: build
        uses: docker/build-push-action@v6
        with:
          # Build context is in root file
          context: .
          file: ./Dockerfile
          # Only publish container if there is a push to main
          # load: true runs image locally for verification without having to push/pull
          load: true
          push: false
          # Name and tag for build image
          # Remove latest, add run number and sha to make each unique
          tags: local/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # We pass in the go version from the file as an argument
          build-args: GO_VERSION=${{ steps.goversion.outputs.go_version }}

      - name: Run Container
        # Map host :80 to container :8080 (adjust container port if your app listens elsewhere)
        run: docker run -d --rm --name liatrio_verify -e PORT=8080 -p 80:8080 local/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # In some cases, app may not be ready right after container is created, so we add a wait step to check if app is responding before running tests
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sSf http://localhost/ > /dev/null; then
              echo "App is ready."
              exit 0
            fi
            echo "Waiting for app... ($i/20)"
            sleep 1
          done

          echo "App did not become ready in time."
          docker logs liatrio_verify || true
          exit 1

      # Run the Liatrio tests
      - name: run tests
        # This path uses the last commit of a specific Liatrio branch called apprentice-action-update that should work regardless of where the branch goes or is named
        # Check and see if this needs to be updated
        uses: liatrio/github-actions/apprentice-action@604b4e04e06c0e98958e7960a4e7dbcc65ae948b
        # liatrio/github-actions/apprentice-action@apprentice-action-update
        # liatrio/github-actions/apprentice-action@master

      # Run cleanup to close container in case of failure
      - name: Cleanup container
        if: always()
        run: docker stop liatrio_verify || true

  CD: 
    name: Push and Deploy
    # ----------------------
    # ONLY IF PUSH TO MAIN:
    # ----------------------
    runs-on: ubuntu-latest
    needs: CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read Go Version
        id: goversion
        run: echo "go_version=$(cat .go-version)" >> $GITHUB_OUTPUT

      - name: Compute Image Tag
        id: img
        run: echo "tag=${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Guide recommends using secrets for username and password. Secrets can be accessed in repo settings
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          build-args: GO_VERSION=${{ steps.goversion.outputs.go_version }}

      # Sign in to google cloud and automatically deploy
      # If statements are temporary to allow testing of above.
      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (versioned image)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}"
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --quiet






            






      

      

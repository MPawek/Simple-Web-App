# I see mentions of GitHub secrets having problems with forked PRs, need to check if this is an issue 


# First step, build the Docker image
# Run this action on any push or pull request, conditional statements later will separate only pushes to main for publishing
name: Build and Verify
on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "**" ]

# Concurrency check so we don't overwrite code being pushed by multiple people at the same time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Set IMAGE_NAME variable as we'll use it a bunch
env:
  IMAGE_NAME: simple-web-app

jobs:
  # Job name: 
  CI:
    # ---------------
    # ALWAYS OCCURS
    # ---------------

    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Check go version from file, echo GO_VERSION=<contents>, append to GITHUB_OUTPUT file
      - name: Read Go Version
        id: goversion
        run: echo "GO_VERSION=$(cat .go-version)" >> $GITHUB_OUTPUT

      # This step is not required, but was recommended
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          # Build context is in root file
          context: .
          file: ./Dockerfile
          # Only publish container if there is a push to main
          # load: true runs image locally for verification without having to push/pull
          load: true
          push: false
          # Name and tag for build image
          # Remove latest, add run number and sha to make each unique
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}-${{ github.sha }}
          # We pass in the go version from the file as an argument
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}

      - name: Run Container
        run: |
          TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}-${{ github.sha }}

          # Map host :80 to container :8080 (adjust container port if your app listens elsewhere)
          docker run -d --rm --name liatrio_verify -p 80:8080 -e PORT=8080 "$TAG"

      # Run the Liatrio tests
      - name: run tests
        # This path uses the last commit of a specific Liatrio branch called apprentice-action-update that should work regardless of where the branch goes or is named
        # Check and see if this needs to be updated
        uses: liatrio/github-actions/apprentice-action@604b4e04e06c0e98958e7960a4e7dbcc65ae948b
          # liatrio/github-actions/apprentice-action@apprentice-action-update
          # liatrio/github-actions/apprentice-action@master


      # ----------------------
      # ONLY IF PUSH TO MAIN:
      # ----------------------
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          # Guide recommends using secrets for username and password. Secrets can be accessed in repo settings
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Push Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}







            
      


# Reference: https://github.com/marketplace/actions/build-and-push-docker-images

name: CI/CD
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]

# Concurrency check so we don't overwrite code being pushed by multiple people at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: simple-web-app

jobs:
  CI:
    name: Build and Verify
    # ---------------
    # ALWAYS OCCURS
    # ---------------
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read Go Version
        id: goversion
        run: echo "go_version=$(cat .go-version)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Locally built to run and test
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Only publish container if there is a push to main
          # load: true runs image locally for verification without having to push/pull
          load: true
          push: false
          tags: local/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: GO_VERSION=${{ steps.goversion.outputs.go_version }}

      - name: Run Container
        # Flags:
        # -d: detached mode, runs container in background and prints container ID
        # --rm: automatically remove container when it exits (good for testing to avoid leftover containers)
        # -name: gives the container a name so we can reference it in later steps (like logs or cleanup)
        # -e: sets environment variables in the container, in this case we set PORT to 8080 to match what our app listens on
        # -p: maps port 8080 in the container to port 8080 on the host machine
        run: docker run -d --rm --name liatrio_verify -e PORT=8080 -p 8080:8080 local/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # In some cases, app may not be ready right after container is created, so we add a wait step to check if app is responding before running tests
      - name: Wait for app to be ready
        # Flags: 
        # -s: silent mode, don't show progress meter or error messages
        # -S: when used with -s, makes curl show error messages if it fails
        # -f: fail silently on server errors (400 and 500 status codes)
        run: |
          for i in $(seq 1 20); do
            if curl -s -S -f http://localhost:8080/ > /dev/null; then
              echo "App is ready."
              exit 0
            fi
            echo "Waiting for app... ($i/20)"
            sleep 2
          done

          echo "App did not become ready in time."
          docker logs liatrio_verify || true
          exit 1

      - name: Run Tests
        # This path uses the specific commit of the tests that should work; when the repo is updated we will change it to the comment below
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91
        # The test that should be used is here
        # liatrio/github-actions/apprentice-action@master

      - name: Cleanup container
        if: always()
        run: docker stop liatrio_verify || true

  CD: 
    name: Push and Deploy
    # ----------------------
    # ONLY IF PUSH TO MAIN:
    # ----------------------
    runs-on: ubuntu-latest
    needs: CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read Go Version
        id: goversion
        run: echo "go_version=$(cat .go-version)" >> $GITHUB_OUTPUT

      - name: Compute Image Tag
        id: img
        run: echo "tag=${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          build-args: GO_VERSION=${{ steps.goversion.outputs.go_version }}

      # Note, for scalability, would likely move to OIDC/Workload Identity Federation to avoid private key use
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (versioned image)
        run: |
          IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}"
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars VERSION="${{ steps.img.outputs.tag }}" \
            --quiet
        
      - name: Verify Deployed Change is Live
        run: |
          SERVICE="${{ secrets.CLOUD_RUN_SERVICE }}"
          REGION="${{ secrets.GCP_REGION }}"
          EXPECTED_VERSION="${{ steps.img.outputs.tag }}"
          
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"

          for i in $(seq 1 10); do
            RESP="$(curl -s -S -f "$URL" || true)"

            if echo "$RESP" | grep -F "\"version\":\"$EXPECTED_VERSION\"" > /dev/null; then
              echo "Verified: deployed version is $EXPECTED_VERSION"
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Deployed service did not return expected version: $EXPECTED_VERSION"
          exit 1




            






      

      
